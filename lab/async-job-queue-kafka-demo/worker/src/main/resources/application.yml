server:
  port: 8081

spring:
  application:
    name: worker

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobqueue}
    username: ${DB_USER:jobqueue}
    password: ${DB_PASSWORD:jobqueue}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: job-worker-group
      auto-offset-reset: earliest

jobqueue:
  storage:
    storage-dir: ${STORAGE_STORAGE_DIR:/data/storage}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    com.ashfaq.jobqueue: INFO
